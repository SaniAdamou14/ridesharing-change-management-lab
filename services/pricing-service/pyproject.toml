[project]
name = "pricing-service"
version = "1.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "pydantic", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-branch --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
