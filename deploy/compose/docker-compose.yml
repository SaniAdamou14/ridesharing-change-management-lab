name: ridesharing-lab
services:
  pricing-service:
    build: ../../services/pricing-service
    image: pricing-service:1.1.0
    ports: ["8011:8011"]
    environment:
      SERVICE_VERSION: "1.1.0"
      POLICY_VERSION: "2026.10.1"
      MAX_SURGE_MULTIPLIER: "3.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 512M}
    networks: [internal]
  allocation-service:
    build: ../../services/allocation-service
    image: allocation-service:1.0.0
    ports: ["8012:8012"]
    environment:
      SERVICE_VERSION: "1.0.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 512M}
    networks: [internal]
networks:
  internal: {}
